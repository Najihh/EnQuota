name: Build and Release

on:
  push:
    branches:
      - release
      - 'release/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            output: enquota-linux-amd64
          - target: bun-linux-arm64
            output: enquota-linux-arm64
          - target: bun-darwin-arm64
            output: enquota-darwin-arm64
          - target: bun-darwin-x64
            output: enquota-darwin-amd64
          - target: bun-windows-x64
            output: enquota-windows-amd64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build standalone binary
        run: |
          mkdir -p build
          bun build --compile --minify --target=${{ matrix.target }} ./src/index.ts --outfile build/${{ matrix.output }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: build/${{ matrix.output }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from package.json
        id: pkg_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg_version.outputs.version }}
          name: Release ${{ steps.pkg_version.outputs.version }}
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
